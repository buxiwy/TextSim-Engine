<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TextSim-Engine — 轻量级文字沙盘开源微引擎</title>
<style>
:root {
  --cream: #F6F1E6; --surface: #FBF8F0; --brown: #3E3223; --brown-d: #2E2418;
  --tech: #1FA97A; --tech-b: #147A58; --moss: #6B8E4E; --line: rgba(74,59,42,.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--cream); color: var(--brown); line-height: 1.6; padding: 28px 18px;
}
.container { max-width: 960px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.badge { font-family: monospace; font-size: .75rem; padding: 4px 10px; border-radius: 99px; background: rgba(31,169,122,.12); color: var(--tech-b); font-weight: 700; }
h1 { font-size: 1.5rem; color: var(--brown-d); }
.showcase-link { font-size: .85rem; font-weight: 700; color: #fff; background: var(--tech-b); padding: 8px 16px; border-radius: 99px; text-decoration: none; }
.showcase-link:hover { background: var(--moss); }
.grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
@media(max-width: 720px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
.card h2 { font-size: .95rem; color: var(--moss); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }
.stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: .9rem; }
.stat-val { font-weight: 700; font-family: monospace; color: var(--tech-b); }
.btn { display: inline-block; width: 100%; text-align: left; padding: 10px 14px; margin-bottom: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--cream); color: var(--brown-d); font-weight: 600; cursor: pointer; transition: .2s; }
.btn:hover:not(:disabled) { border-color: var(--tech-b); background: rgba(31,169,122,.08); transform: translateY(-1px); }
.btn-primary { background: var(--tech-b); color: #fff; text-align: center; }
.btn-primary:hover { background: var(--moss) !important; color: #fff; }
.log-box { max-height: 290px; overflow-y: auto; font-size: .86rem; display: flex; flex-direction: column; gap: 8px; }
.log-item { padding: 8px 12px; border-radius: 8px; background: var(--cream); border-left: 3px solid var(--moss); }
.event-modal { border: 2px solid var(--tech-b); background: #EDF5F0; }
.epitaph-box { background: #2E2418; color: #F6F1E6; padding: 24px; border-radius: 16px; text-align: center; }
.epitaph-score { font-size: 2.4rem; color: #8FD9C0; font-weight: 900; margin: 10px 0; }
.tier-tag { display: inline-block; padding: 3px 9px; margin: 4px; border-radius: 6px; background: rgba(255,255,255,.12); font-size: .8rem; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <span class="badge">OPEN SOURCE SANDBOX ENGINE</span>
      <h1 id="gameTitle">TextSim-Engine</h1>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <button onclick="startNew('poor')" style="cursor:pointer;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600">↻ 重开一局</button>
      <a class="showcase-link" href="https://dayantx.online/" target="_blank">🎮 官方完整版案例：《大衍天下》↗</a>
    </div>
  </header>

  <div class="grid">
    <!-- 左侧：人物属性与地图移动 -->
    <div>
      <div class="card">
        <h2>人物状态 · STATUS</h2>
        <div id="statsPanel"></div>
      </div>
      <div class="card">
        <h2>沙盘州府移动 · MAP</h2>
        <p id="locDesc" style="font-size:.8rem;opacity:.75;margin-bottom:10px"></p>
        <div id="mapActions"></div>
      </div>
    </div>

    <!-- 右侧：事件、行动路线、墓志铭与编年史日志 -->
    <div>
      <div id="eventContainer"></div>
      <div id="epitaphContainer"></div>

      <div class="card" id="actionCard">
        <h2>年度前程抉择 · ACTIONS (推进 1 年)</h2>
        <div id="routeActions"></div>
      </div>

      <div class="card">
        <h2>生平编年史 · CHRONICLE LOGS</h2>
        <div class="log-box" id="logBox"></div>
      </div>
    </div>
  </div>
</div>

<script src="./data/demo-world.js"></script>
<script src="./src/engine.js"></script>
<script>
const engine = new TextSimEngine(window.WORLD_DATA);
document.getElementById("gameTitle").textContent = window.WORLD_DATA.meta.title;

if (!engine.loadFromLocal()) {
  engine.initGame("poor");
}

function startNew(originId) {
  engine.initGame(originId);
  render();
}

function render() {
  const s = engine.state;
  const curLoc = window.WORLD_DATA.map[s.location];

  // 1. 渲染属性
  document.getElementById("statsPanel").innerHTML = `
    <div class="stat-row"><span>出身</span><span class="stat-val">${s.origin}</span></div>
    <div class="stat-row"><span>骨龄</span><span class="stat-val">${s.age} / 30 岁</span></div>
    <div class="stat-row"><span>当前所在</span><span class="stat-val">📍 ${curLoc.name}</span></div>
    <div class="stat-row"><span>才学 (Wit)</span><span class="stat-val">${s.wit}</span></div>
    <div class="stat-row"><span>武名 (Martial)</span><span class="stat-val">${s.martial}</span></div>
    <div class="stat-row"><span>乡望 (Rep)</span><span class="stat-val">${s.rep}</span></div>
    <div class="stat-row"><span>盘缠 (Wealth)</span><span class="stat-val">${s.wealth} 两</span></div>
    <div class="stat-row"><span>猜忌度 (满100死)</span><span class="stat-val" style="color:${s.suspicion>=70?'#c0392b':'inherit'}">${s.suspicion} / 100</span></div>
    <div class="stat-row"><span>已达成里程碑</span><span class="stat-val">${s.milestones.length ? s.milestones.join("、") : "暂无"}</span></div>
  `;

  // 2. 渲染地图移动
  document.getElementById("locDesc").textContent = curLoc.desc;
  document.getElementById("mapActions").innerHTML = curLoc.adj.map(targetId => {
    const t = window.WORLD_DATA.map[targetId];
    return `<button class="btn" ${!s.alive || s.activeEvent ? 'disabled' : ''} onclick="goTravel('${targetId}')">
      🐎 前往【${t.name}】 <span style="float:right;font-size:.78rem;opacity:.7">路费 ${t.cost} 两</span>
    </button>`;
  }).join("");

  // 3. 渲染随机事件
  const evBox = document.getElementById("eventContainer");
  if (s.alive && s.activeEvent) {
    evBox.innerHTML = `<div class="card event-modal">
      <h2>⚡ 当年突发际遇 · EVENT</h2>
      <p style="margin-bottom:14px;font-weight:600">${s.activeEvent.text}</p>
      ${s.activeEvent.choices.map((c, idx) => `
        <button class="btn" onclick="pickChoice(${idx})">▸ ${c.label}</button>
      `).join("")}
    </div>`;
  } else {
    evBox.innerHTML = "";
  }

  // 4. 渲染行动面板或墓志铭
  const actCard = document.getElementById("actionCard");
  const epBox = document.getElementById("epitaphContainer");
  if (s.alive) {
    epBox.innerHTML = "";
    actCard.style.display = "block";
    document.getElementById("routeActions").innerHTML = window.WORLD_DATA.routes.map(r => {
      const needLoc = window.WORLD_DATA.map[r.milestone.loc].name;
      return `<button class="btn" ${s.activeEvent ? 'disabled' : ''} onclick="doRoute('${r.id}')">
        <strong>${r.name}</strong> — ${r.desc}
        <div style="font-size:.75rem;opacity:.68;margin-top:2px">里程碑「${r.milestone.title}」要求：属性≥${r.milestone.req} 且身处【${needLoc}】</div>
      </button>`;
    }).join("");
  } else {
    actCard.style.display = "none";
    const ep = engine.generateEpitaph();
    epBox.innerHTML = `<div class="card epitaph-box">
      <div style="font-family:monospace;opacity:.7;font-size:.8rem">EPITAPH · 墓志铭结算</div>
      <h3 style="margin-top:6px">享年 ${ep.age} 岁 · ${ep.origin}</h3>
      <p style="font-size:.9rem;opacity:.85;margin:8px 0">${ep.reason}</p>
      <div class="epitaph-score">${ep.totalScore} 分</div>
      <div style="margin-bottom:16px">
        ${ep.unlocked.length ? ep.unlocked.map(a => `<span class="tier-tag">[${a.tier}·${a.points}分] ${a.name}</span>`).join("") : "<span class='tier-tag'>平凡一生（未解锁成就）</span>"}
      </div>
      <button class="btn btn-primary" onclick="startNew('poor')">🔄 重新投胎（寒门开局）</button>
      <button class="btn" style="text-align:center;background:rgba(255,255,255,.1);color:#fff" onclick="startNew('rich')">👑 重新投胎（世家庶子开局）</button>
    </div>`;
  }

  // 5. 渲染日志
  document.getElementById("logBox").innerHTML = s.logs.map(l => `<div class="log-item">${l}</div>`).join("");
}

function doRoute(id) { engine.takeAction(id); render(); }
function goTravel(locId) {
  const res = engine.travel(locId);
  if (res && !res.ok) alert(res.msg);
  render();
}
function pickChoice(idx) { engine.resolveEvent(idx); render(); }

render();
</script>
</body>
</html>
